<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Movie Recap Blur Editor</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #editor {

            position: relative;

            width: 100%;

            margin: 0 auto;

            background: #000;

            overflow: hidden;

            border-radius: 10px;

            user-select: none;
            -webkit-user-select: none;

            touch-action: none;
        }

        #video {

            display: block;

            width: 100%;

            height: auto;

            max-height: 75vh;

            object-fit: contain;

            background: #000;
        }

        #blurBox {

            position: absolute;

            left: 10%;
            top: 78%;

            width: 80%;
            height: 18%;

            min-width: 8%;
            min-height: 5%;

            border: 2px solid #ff3158;

            background: rgba(
                255,
                49,
                88,
                0.15
            );

            box-shadow:
                0 0 0 1px rgba(0,0,0,0.5),
                0 0 12px rgba(255,49,88,0.3);

            z-index: 10;

            touch-action: none;

            cursor: move;
        }

        #blurLabel {

            position: absolute;

            left: 50%;
            top: 4px;

            transform: translateX(-50%);

            padding: 3px 9px;

            border-radius: 5px;

            background: rgba(
                255,
                49,
                88,
                0.95
            );

            color: white;

            font-size: 11px;

            font-weight: bold;

            pointer-events: none;

            white-space: nowrap;

            z-index: 30;
        }

        .handle {

            position: absolute;

            width: 20px;
            height: 20px;

            border-radius: 50%;

            background: #fff;

            border: 3px solid #ff3158;

            z-index: 50;

            touch-action: none;
        }

        .nw {

            left: -10px;
            top: -10px;

            cursor: nwse-resize;
        }

        .n {

            left: 50%;
            top: -10px;

            transform: translateX(-50%);

            cursor: ns-resize;
        }

        .ne {

            right: -10px;
            top: -10px;

            cursor: nesw-resize;
        }

        .e {

            right: -10px;
            top: 50%;

            transform: translateY(-50%);

            cursor: ew-resize;
        }

        .se {

            right: -10px;
            bottom: -10px;

            cursor: nwse-resize;
        }

        .s {

            left: 50%;
            bottom: -10px;

            transform: translateX(-50%);

            cursor: ns-resize;
        }

        .sw {

            left: -10px;
            bottom: -10px;

            cursor: nesw-resize;
        }

        .w {

            left: -10px;
            top: 50%;

            transform: translateY(-50%);

            cursor: ew-resize;
        }

        @media (max-width: 600px) {

            #video {
                max-height: 70vh;
            }

            .handle {

                width: 24px;
                height: 24px;
            }

            .nw {

                left: -12px;
                top: -12px;
            }

            .n {
                top: -12px;
            }

            .ne {

                right: -12px;
                top: -12px;
            }

            .e {
                right: -12px;
            }

            .se {

                right: -12px;
                bottom: -12px;
            }

            .s {
                bottom: -12px;
            }

            .sw {

                left: -12px;
                bottom: -12px;
            }

            .w {
                left: -12px;
            }

        }

    </style>

</head>


<body>


<div id="editor">

    <video
        id="video"
        controls
        playsinline
        preload="metadata">
    </video>


    <div id="blurBox">

        <div id="blurLabel">
            BLUR
        </div>


        <div
            class="handle nw"
            data-handle="nw">
        </div>


        <div
            class="handle n"
            data-handle="n">
        </div>


        <div
            class="handle ne"
            data-handle="ne">
        </div>


        <div
            class="handle e"
            data-handle="e">
        </div>


        <div
            class="handle se"
            data-handle="se">
        </div>


        <div
            class="handle s"
            data-handle="s">
        </div>


        <div
            class="handle sw"
            data-handle="sw">
        </div>


        <div
            class="handle w"
            data-handle="w">
        </div>

    </div>

</div>


<script>


(function () {

    "use strict";


    /*
     * =====================================================
     * STREAMLIT COMPONENT PROTOCOL
     * =====================================================
     *
     * IMPORTANT:
     *
     * apiVersion MUST be at the top level
     * of the componentReady message.
     *
     * It must NOT be inside data.
     *
     * =====================================================
     */


    const COMPONENT_READY =
        "streamlit:componentReady";


    const SET_COMPONENT_VALUE =
        "streamlit:setComponentValue";


    const SET_FRAME_HEIGHT =
        "streamlit:setFrameHeight";


    const RENDER_EVENT =
        "streamlit:render";


    /*
     * =====================================================
     * SEND BASIC STREAMLIT MESSAGE
     * =====================================================
     */

    function sendMessage(
        type,
        data
    ) {

        const message = {

            isStreamlitMessage: true,

            type: type

        };


        if (
            data !== undefined
        ) {

            message.data = data;

        }


        window.parent.postMessage(
            message,
            "*"
        );

    }


    /*
     * =====================================================
     * COMPONENT READY
     * =====================================================
     *
     * apiVersion is intentionally OUTSIDE data.
     *
     * =====================================================
     */

    function setComponentReady() {

        window.parent.postMessage(

            {

                isStreamlitMessage: true,

                type:
                    COMPONENT_READY,

                apiVersion: 1

            },

            "*"

        );

    }


    /*
     * =====================================================
     * SET COMPONENT VALUE
     * =====================================================
     */

    function setComponentValue(
        value
    ) {

        window.parent.postMessage(

            {

                isStreamlitMessage: true,

                type:
                    SET_COMPONENT_VALUE,

                value:
                    value,

                dataType:
                    "json"

            },

            "*"

        );

    }


    /*
     * =====================================================
     * SET FRAME HEIGHT
     * =====================================================
     */

    function setFrameHeight(
        height
    ) {

        window.parent.postMessage(

            {

                isStreamlitMessage: true,

                type:
                    SET_FRAME_HEIGHT,

                height:
                    Math.max(
                        250,
                        Math.ceil(height)
                    )

            },

            "*"

        );

    }


    /*
     * =====================================================
     * ELEMENTS
     * =====================================================
     */

    const editor =
        document.getElementById(
            "editor"
        );


    const video =
        document.getElementById(
            "video"
        );


    const blurBox =
        document.getElementById(
            "blurBox"
        );


    /*
     * =====================================================
     * STATE
     * =====================================================
     */

    let state = {

        x: 10,

        y: 78,

        width: 80,

        height: 18

    };


    let videoSrc = "";

    let interaction = null;

    let lastSent = null;


    /*
     * =====================================================
     * CLAMP
     * =====================================================
     */

    function clamp(
        value,
        min,
        max
    ) {

        return Math.max(
            min,
            Math.min(
                max,
                value
            )
        );

    }


    /*
     * =====================================================
     * NORMALIZE
     * =====================================================
     */

    function normalize() {

        const minWidth =
            8;


        const minHeight =
            5;


        state.width =
            clamp(
                state.width,
                minWidth,
                100
            );


        state.height =
            clamp(
                state.height,
                minHeight,
                100
            );


        state.x =
            clamp(
                state.x,
                0,
                100 - state.width
            );


        state.y =
            clamp(
                state.y,
                0,
                100 - state.height
            );

    }


    /*
     * =====================================================
     * RENDER BLUR BOX
     * =====================================================
     */

    function renderBox() {

        normalize();


        blurBox.style.left =
            state.x + "%";


        blurBox.style.top =
            state.y + "%";


        blurBox.style.width =
            state.width + "%";


        blurBox.style.height =
            state.height + "%";


        updateHeight();

    }


    /*
     * =====================================================
     * FRAME HEIGHT
     * =====================================================
     */

    function updateHeight() {

        requestAnimationFrame(

            function () {

                const height =
                    editor.getBoundingClientRect()
                    .height + 10;


                setFrameHeight(
                    height
                );

            }

        );

    }


    /*
     * =====================================================
     * SEND BLUR POSITION
     * =====================================================
     */

    function sendValue() {

        const result = {

            x:
                Number(
                    state.x.toFixed(3)
                ),

            y:
                Number(
                    state.y.toFixed(3)
                ),

            width:
                Number(
                    state.width.toFixed(3)
                ),

            height:
                Number(
                    state.height.toFixed(3)
                )

        };


        /*
         * Don't send duplicate values.
         */

        if (
            lastSent &&

            Math.abs(
                lastSent.x -
                result.x
            ) < 0.001 &&

            Math.abs(
                lastSent.y -
                result.y
            ) < 0.001 &&

            Math.abs(
                lastSent.width -
                result.width
            ) < 0.001 &&

            Math.abs(
                lastSent.height -
                result.height
            ) < 0.001
        ) {

            return;

        }


        lastSent =
            result;


        setComponentValue(
            result
        );

    }


    /*
     * =====================================================
     * GET POINTER POSITION
     * =====================================================
     */

    function pointerPosition(
        event
    ) {

        const rect =
            editor.getBoundingClientRect();


        if (
            rect.width <= 0 ||
            rect.height <= 0
        ) {

            return {
                x: 0,
                y: 0
            };

        }


        const px =
            event.clientX -
            rect.left;


        const py =
            event.clientY -
            rect.top;


        return {

            x:
                (
                    px /
                    rect.width
                ) * 100,

            y:
                (
                    py /
                    rect.height
                ) * 100

        };

    }


    /*
     * =====================================================
     * POINTER DOWN
     * =====================================================
     */

    function pointerDown(
        event
    ) {

        event.preventDefault();

        event.stopPropagation();


        const point =
            pointerPosition(
                event
            );


        const handle =
            event.target.closest(
                ".handle"
            );


        if (handle) {

            interaction = {

                type:
                    "resize",

                handle:
                    handle.dataset.handle,

                startX:
                    point.x,

                startY:
                    point.y,

                originalX:
                    state.x,

                originalY:
                    state.y,

                originalWidth:
                    state.width,

                originalHeight:
                    state.height

            };

        }

        else {

            interaction = {

                type:
                    "move",

                handle:
                    null,

                startX:
                    point.x,

                startY:
                    point.y,

                originalX:
                    state.x,

                originalY:
                    state.y,

                originalWidth:
                    state.width,

                originalHeight:
                    state.height

            };

        }


        try {

            blurBox.setPointerCapture(
                event.pointerId
            );

        }

        catch (error) {}

    }


    /*
     * =====================================================
     * POINTER MOVE
     * =====================================================
     */

    function pointerMove(
        event
    ) {

        if (
            !interaction
        ) {

            return;

        }


        event.preventDefault();


        const point =
            pointerPosition(
                event
            );


        const dx =
            point.x -
            interaction.startX;


        const dy =
            point.y -
            interaction.startY;


        /*
         * ================================================
         * MOVE
         * ================================================
         */

        if (
            interaction.type ===
            "move"
        ) {

            state.x =
                interaction.originalX +
                dx;


            state.y =
                interaction.originalY +
                dy;


            state.width =
                interaction.originalWidth;


            state.height =
                interaction.originalHeight;


            normalize();

            renderBox();

            return;

        }


        /*
         * ================================================
         * RESIZE
         * ================================================
         */

        const handle =
            interaction.handle;


        let x =
            interaction.originalX;


        let y =
            interaction.originalY;


        let width =
            interaction.originalWidth;


        let height =
            interaction.originalHeight;


        /*
         * LEFT
         */

        if (
            handle.includes("w")
        ) {

            const right =
                interaction.originalX +
                interaction.originalWidth;


            const newX =
                interaction.originalX +
                dx;


            x =
                clamp(
                    newX,
                    0,
                    right - 8
                );


            width =
                right - x;

        }


        /*
         * RIGHT
         */

        if (
            handle.includes("e")
        ) {

            const right =
                interaction.originalX +
                interaction.originalWidth +
                dx;


            const limitedRight =
                clamp(
                    right,
                    interaction.originalX + 8,
                    100
                );


            width =
                limitedRight -
                interaction.originalX;

        }


        /*
         * TOP
         */

        if (
            handle.includes("n")
        ) {

            const bottom =
                interaction.originalY +
                interaction.originalHeight;


            const newY =
                interaction.originalY +
                dy;


            y =
                clamp(
                    newY,
                    0,
                    bottom - 5
                );


            height =
                bottom - y;

        }


        /*
         * BOTTOM
         */

        if (
            handle.includes("s")
        ) {

            const bottom =
                interaction.originalY +
                interaction.originalHeight +
                dy;


            const limitedBottom =
                clamp(
                    bottom,
                    interaction.originalY + 5,
                    100
                );


            height =
                limitedBottom -
                interaction.originalY;

        }


        state.x =
            x;


        state.y =
            y;


        state.width =
            width;


        state.height =
            height;


        normalize();

        renderBox();

    }


    /*
     * =====================================================
     * POINTER UP
     * =====================================================
     */

    function pointerUp(
        event
    ) {

        if (
            !interaction
        ) {

            return;

        }


        event.preventDefault();


        interaction = null;


        try {

            blurBox.releasePointerCapture(
                event.pointerId
            );

        }

        catch (error) {}


        normalize();

        renderBox();


        /*
         * Send ONLY after
         * finger/mouse release.
         */

        sendValue();

    }


    /*
     * =====================================================
     * POINTER CANCEL
     * =====================================================
     */

    function pointerCancel() {

        if (
            !interaction
        ) {

            return;

        }


        interaction = null;


        normalize();

        renderBox();

        sendValue();

    }


    /*
     * =====================================================
     * POINTER EVENTS
     * =====================================================
     */

    blurBox.addEventListener(
        "pointerdown",
        pointerDown
    );


    blurBox.addEventListener(
        "pointermove",
        pointerMove
    );


    blurBox.addEventListener(
        "pointerup",
        pointerUp
    );


    blurBox.addEventListener(
        "pointercancel",
        pointerCancel
    );


    /*
     * =====================================================
     * TOUCH PROTECTION
     * =====================================================
     */

    blurBox.addEventListener(

        "touchstart",

        function (event) {

            event.preventDefault();

        },

        {
            passive: false
        }

    );


    blurBox.addEventListener(

        "touchmove",

        function (event) {

            if (interaction) {

                event.preventDefault();

            }

        },

        {
            passive: false
        }

    );


    /*
     * =====================================================
     * STREAMLIT RENDER MESSAGE
     * =====================================================
     */

    function handleRender(
        event
    ) {

        const message =
            event.data;


        if (
            !message
        ) {

            return;

        }


        if (
            message.type !==
            RENDER_EVENT
        ) {

            return;

        }


        const args =
            message.args || {};


        /*
         * ================================================
         * VIDEO
         * ================================================
         */

        if (
            args.video_src &&
            args.video_src !== videoSrc
        ) {

            videoSrc =
                args.video_src;


            video.src =
                videoSrc;


            video.load();

        }


        /*
         * ================================================
         * INITIAL BLUR POSITION
         * ================================================
         */

        if (

            typeof args.initial_x ===
            "number" &&

            typeof args.initial_y ===
            "number" &&

            typeof args.initial_width ===
            "number" &&

            typeof args.initial_height ===
            "number"

        ) {

            /*
             * Don't overwrite the user's
             * current drag position.
             */

            if (
                !interaction
            ) {

                state.x =
                    args.initial_x;


                state.y =
                    args.initial_y;


                state.width =
                    args.initial_width;


                state.height =
                    args.initial_height;


                renderBox();

            }

        }


        updateHeight();

    }


    /*
     * =====================================================
     * LISTEN TO STREAMLIT
     * =====================================================
     */

    window.addEventListener(
        "message",
        handleRender
    );


    /*
     * =====================================================
     * WINDOW RESIZE
     * =====================================================
     */

    window.addEventListener(

        "resize",

        function () {

            renderBox();

        }

    );


    /*
     * =====================================================
     * VIDEO METADATA
     * =====================================================
     */

    video.addEventListener(

        "loadedmetadata",

        function () {

            renderBox();

            updateHeight();

        }

    );


    /*
     * =====================================================
     * VIDEO ERROR
     * =====================================================
     */

    video.addEventListener(

        "error",

        function () {

            console.log(
                "Video could not be played by browser."
            );

            updateHeight();

        }

    );


    /*
     * =====================================================
     * RESIZE OBSERVER
     * =====================================================
     */

    if (
        window.ResizeObserver
    ) {

        const observer =
            new ResizeObserver(

                function () {

                    updateHeight();

                }

            );


        observer.observe(
            editor
        );

    }


    /*
     * =====================================================
     * INITIAL BOX
     * =====================================================
     */

    renderBox();


    /*
     * =====================================================
     * TELL STREAMLIT COMPONENT IS READY
     * =====================================================
     *
     * IMPORTANT:
     * apiVersion: 1 is TOP LEVEL.
     *
     * =====================================================
     */

    setComponentReady();


    updateHeight();


})();

</script>

</body>

</html>
