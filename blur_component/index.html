<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Blur Video Editor</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;

    background: #080b16;

    overflow: hidden;

    font-family: Arial, sans-serif;
}


/* =========================================================
   APP
   ========================================================= */

#app {

    width: 100%;

    padding: 4px;

    margin: 0;

}


/* =========================================================
   VIDEO EDITOR
   ========================================================= */

#editor {

    position: relative;

    width: 100%;

    max-width: none;

    margin: 0 auto;

    background: #000;

    border-radius: 10px;

    overflow: hidden;

    touch-action: none;

    user-select: none;

    -webkit-user-select: none;

    /*
       Aspect ratio is controlled by JavaScript
       after video metadata is loaded.
    */

    aspect-ratio: 16 / 9;

}


/* =========================================================
   VIDEO
   ========================================================= */

#video {

    display: block;

    width: 100%;

    height: 100%;

    min-width: 100%;

    min-height: 100%;

    max-width: none;

    max-height: none;

    object-fit: contain;

    object-position: center;

    background: #000;

    pointer-events: auto;

}


/* =========================================================
   BLUR BOX
   ========================================================= */

#blurBox {

    position: absolute;

    left: 10%;

    top: 78%;

    width: 80%;

    height: 18%;

    min-width: 40px;

    min-height: 30px;

    border: 2px solid #b56cff;

    background: rgba(160, 80, 255, 0.18);

    box-shadow:

        0 0 0 1px rgba(255,255,255,0.18),

        0 0 14px rgba(181,108,255,0.45);

    border-radius: 6px;

    touch-action: none;

    user-select: none;

    -webkit-user-select: none;

    z-index: 20;

}


/* =========================================================
   BLUR LABEL
   ========================================================= */

#blurLabel {

    position: absolute;

    left: 50%;

    top: 50%;

    transform: translate(-50%, -50%);

    color: #fff;

    font-size: 13px;

    font-weight: bold;

    white-space: nowrap;

    pointer-events: none;

    text-shadow:

        0 1px 3px #000,

        0 0 6px #000;

}


/* =========================================================
   RESIZE HANDLES
   ========================================================= */

.handle {

    position: absolute;

    width: 22px;

    height: 22px;

    background: #fff;

    border: 2px solid #9b4dff;

    border-radius: 50%;

    box-shadow:

        0 1px 6px rgba(0,0,0,0.7);

    z-index: 30;

    touch-action: none;

}


/* =========================
   HANDLE POSITIONS
   ========================= */

.nw {

    left: -11px;

    top: -11px;

    cursor: nwse-resize;

}

.n {

    left: 50%;

    top: -11px;

    transform: translateX(-50%);

    cursor: ns-resize;

}

.ne {

    right: -11px;

    top: -11px;

    cursor: nesw-resize;

}

.e {

    right: -11px;

    top: 50%;

    transform: translateY(-50%);

    cursor: ew-resize;

}

.se {

    right: -11px;

    bottom: -11px;

    cursor: nwse-resize;

}

.s {

    left: 50%;

    bottom: -11px;

    transform: translateX(-50%);

    cursor: ns-resize;

}

.sw {

    left: -11px;

    bottom: -11px;

    cursor: nesw-resize;

}

.w {

    left: -11px;

    top: 50%;

    transform: translateY(-50%);

    cursor: ew-resize;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    #app {

        padding: 2px;

    }

    #editor {

        width: 100%;

        max-width: none;

        border-radius: 8px;

    }

    #video {

        width: 100%;

        height: 100%;

        min-width: 100%;

        min-height: 100%;

    }

    .handle {

        width: 28px;

        height: 28px;

    }

    .nw {

        left: -14px;

        top: -14px;

    }

    .n {

        top: -14px;

    }

    .ne {

        right: -14px;

        top: -14px;

    }

    .e {

        right: -14px;

    }

    .se {

        right: -14px;

        bottom: -14px;

    }

    .s {

        bottom: -14px;

    }

    .sw {

        left: -14px;

        bottom: -14px;

    }

    .w {

        left: -14px;

    }

    #blurLabel {

        font-size: 12px;

    }

}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width: 400px) {

    #app {

        padding: 1px;

    }

    #editor {

        border-radius: 6px;

    }

}

</style>

</head>


<body>


<div id="app">

    <div id="editor">

        <video
            id="video"
            controls
            playsinline
            webkit-playsinline
            preload="metadata"
        ></video>


        <div id="blurBox">

            <div id="blurLabel">
                BLUR
            </div>


            <div
                class="handle nw"
                data-handle="nw"
            ></div>


            <div
                class="handle n"
                data-handle="n"
            ></div>


            <div
                class="handle ne"
                data-handle="ne"
            ></div>


            <div
                class="handle e"
                data-handle="e"
            ></div>


            <div
                class="handle se"
                data-handle="se"
            ></div>


            <div
                class="handle s"
                data-handle="s"
            ></div>


            <div
                class="handle sw"
                data-handle="sw"
            ></div>


            <div
                class="handle w"
                data-handle="w"
            ></div>

        </div>

    </div>

</div>


<script>


/* =========================================================
   STREAMLIT CONSTANTS
   ========================================================= */

const COMPONENT_READY =
    "streamlit:componentReady";

const SET_COMPONENT_VALUE =
    "streamlit:setComponentValue";

const SET_FRAME_HEIGHT =
    "streamlit:setFrameHeight";

const RENDER =
    "streamlit:render";


/* =========================================================
   STATE
   ========================================================= */

let currentArgs = {};

let box = {

    x: 10,

    y: 78,

    width: 80,

    height: 18

};


/*
   Current interaction.

   null = no interaction

   object = moving/resizing
*/

let interaction = null;


/*
   Prevent duplicate values.
*/

let lastSentValue = null;


/*
   IMPORTANT

   Once the user has moved/resized the box,
   don't blindly replace it with old Python
   values on every Streamlit rerun.
*/

let userHasInteracted = false;


/*
   Track current video source.
*/

let currentVideoSource = "";


/*
   Prevent initialization from happening
   repeatedly for the same video.
*/

let initializedForSource = false;


/* =========================================================
   ELEMENTS
   ========================================================= */

const editor =
    document.getElementById("editor");

const video =
    document.getElementById("video");

const blurBox =
    document.getElementById("blurBox");


/* =========================================================
   SEND COMPONENT VALUE
   ========================================================= */

function sendComponentValue(value) {

    const rounded = {

        x: Number(
            value.x.toFixed(2)
        ),

        y: Number(
            value.y.toFixed(2)
        ),

        width: Number(
            value.width.toFixed(2)
        ),

        height: Number(
            value.height.toFixed(2)
        )

    };


    const serialized =
        JSON.stringify(rounded);


    if (
        serialized === lastSentValue
    ) {

        return;

    }


    lastSentValue =
        serialized;


    window.parent.postMessage(

        {

            isStreamlitMessage: true,

            type:
                SET_COMPONENT_VALUE,

            value:
                rounded,

            dataType:
                "json"

        },

        "*"

    );

}


/* =========================================================
   FRAME HEIGHT
   ========================================================= */

function setFrameHeight() {

    const rect =
        editor.getBoundingClientRect();


    const height =
        Math.max(
            100,
            Math.ceil(rect.height + 8)
        );


    window.parent.postMessage(

        {

            isStreamlitMessage: true,

            type:
                SET_FRAME_HEIGHT,

            height:
                height

        },

        "*"

    );

}


/* =========================================================
   COMPONENT READY
   ========================================================= */

function setComponentReady() {

    window.parent.postMessage(

        {

            isStreamlitMessage: true,

            type:
                COMPONENT_READY,

            apiVersion:
                1

        },

        "*"

    );

}


/* =========================================================
   APPLY BOX
   ========================================================= */

function applyBox() {

    blurBox.style.left =
        box.x + "%";


    blurBox.style.top =
        box.y + "%";


    blurBox.style.width =
        box.width + "%";


    blurBox.style.height =
        box.height + "%";


    requestAnimationFrame(

        setFrameHeight

    );

}


/* =========================================================
   NUMBER
   ========================================================= */

function getNumber(
    value,
    fallback
) {

    const n =
        Number(value);


    if (
        !Number.isFinite(n)
    ) {

        return fallback;

    }


    return n;

}


/* =========================================================
   NORMALIZE BOX
   ========================================================= */

function normalizeBox(value) {

    let x =
        Number(value.x);

    let y =
        Number(value.y);

    let width =
        Number(value.width);

    let height =
        Number(value.height);


    if (
        !Number.isFinite(x)
    ) {

        x = 10;

    }


    if (
        !Number.isFinite(y)
    ) {

        y = 78;

    }


    if (
        !Number.isFinite(width)
    ) {

        width = 80;

    }


    if (
        !Number.isFinite(height)
    ) {

        height = 18;

    }


    width =
        Math.max(
            3,
            Math.min(
                width,
                100
            )
        );


    height =
        Math.max(
            3,
            Math.min(
                height,
                100
            )
        );


    x =
        Math.max(
            0,
            Math.min(
                x,
                100 - width
            )
        );


    y =
        Math.max(
            0,
            Math.min(
                y,
                100 - height
            )
        );


    return {

        x,
        y,
        width,
        height

    };

}


/* =========================================================
   LOAD PYTHON BOX
   ========================================================= */

function loadInitialBox(args) {

    /*
       If user is currently interacting,
       never reset the box.
    */

    if (
        interaction !== null
    ) {

        return;

    }


    /*
       If the user already interacted with
       this video, keep the local box.

       This prevents Streamlit reruns from
       restoring stale initial values.
    */

    if (
        userHasInteracted &&
        initializedForSource
    ) {

        applyBox();

        return;

    }


    const newBox = {

        x:
            getNumber(
                args.initial_x,
                10
            ),

        y:
            getNumber(
                args.initial_y,
                78
            ),

        width:
            getNumber(
                args.initial_width,
                80
            ),

        height:
            getNumber(
                args.initial_height,
                18
            )

    };


    box =
        normalizeBox(
            newBox
        );


    applyBox();


    initializedForSource =
        true;

}


/* =========================================================
   SET VIDEO ASPECT RATIO
   ========================================================= */

function updateVideoAspectRatio() {

    const width =
        video.videoWidth;

    const height =
        video.videoHeight;


    if (
        width <= 0 ||
        height <= 0
    ) {

        return;

    }


    /*
       Use the video's real aspect ratio.

       Example:

       576 x 1032

       => 576 / 1032
       => approximately 9 / 16
    */

    const ratio =
        width / height;


    editor.style.aspectRatio =
        width + " / " + height;


    /*
       Make sure video fills the
       entire editor.
    */

    video.style.width =
        "100%";

    video.style.height =
        "100%";


    video.style.objectFit =
        "contain";


    requestAnimationFrame(

        setFrameHeight

    );

}


/* =========================================================
   POINTER PERCENT
   ========================================================= */

function pointerPercent(event) {

    const rect =
        editor.getBoundingClientRect();


    const x =
        (
            (
                event.clientX -
                rect.left
            )
            /
            rect.width
        ) * 100;


    const y =
        (
            (
                event.clientY -
                rect.top
            )
            /
            rect.height
        ) * 100;


    return {

        x,
        y

    };

}


/* =========================================================
   START INTERACTION
   ========================================================= */

function startInteraction(
    event,
    type
) {

    event.preventDefault();

    event.stopPropagation();


    const p =
        pointerPercent(
            event
        );


    interaction = {

        type:

            type,


        startPointerX:

            p.x,


        startPointerY:

            p.y,


        startBox: {

            x:
                box.x,

            y:
                box.y,

            width:
                box.width,

            height:
                box.height

        }

    };


    /*
       IMPORTANT

       Remember that the user has
       manually changed the box.
    */

    userHasInteracted =
        true;


    try {

        event.currentTarget.setPointerCapture(

            event.pointerId

        );

    }

    catch (e) {}

}


/* =========================================================
   UPDATE INTERACTION
   ========================================================= */

function updateInteraction(event) {

    if (
        !interaction
    ) {

        return;

    }


    event.preventDefault();


    const p =
        pointerPercent(
            event
        );


    const dx =
        p.x -
        interaction.startPointerX;


    const dy =
        p.y -
        interaction.startPointerY;


    const start =
        interaction.startBox;


    let next = {

        x:
            start.x,

        y:
            start.y,

        width:
            start.width,

        height:
            start.height

    };


    /* =====================================================
       MOVE
       ===================================================== */

    if (
        interaction.type ===
        "move"
    ) {

        next.x =
            start.x + dx;


        next.y =
            start.y + dy;


        next.x =
            Math.max(
                0,
                Math.min(
                    next.x,
                    100 -
                    next.width
                )
            );


        next.y =
            Math.max(
                0,
                Math.min(
                    next.y,
                    100 -
                    next.height
                )
            );

    }


    /* =====================================================
       NORTH
       ===================================================== */

    if (
        interaction.type.includes(
            "n"
        )
    ) {

        const newY =
            start.y + dy;


        const newHeight =
            start.height - dy;


        if (
            newHeight >= 3
        ) {

            next.y =
                Math.max(
                    0,
                    newY
                );


            next.height =
                Math.min(
                    newHeight,
                    start.y +
                    start.height
                );

        }

    }


    /* =====================================================
       SOUTH
       ===================================================== */

    if (
        interaction.type.includes(
            "s"
        )
    ) {

        const newHeight =
            start.height + dy;


        if (
            newHeight >= 3
        ) {

            next.height =
                Math.min(
                    newHeight,
                    100 -
                    start.y
                );

        }

    }


    /* =====================================================
       WEST
       ===================================================== */

    if (
        interaction.type.includes(
            "w"
        )
    ) {

        const newX =
            start.x + dx;


        const newWidth =
            start.width - dx;


        if (
            newWidth >= 3
        ) {

            next.x =
                Math.max(
                    0,
                    newX
                );


            next.width =
                Math.min(
                    newWidth,
                    start.x +
                    start.width
                );

        }

    }


    /* =====================================================
       EAST
       ===================================================== */

    if (
        interaction.type.includes(
            "e"
        )
    ) {

        const newWidth =
            start.width + dx;


        if (
            newWidth >= 3
        ) {

            next.width =
                Math.min(
                    newWidth,
                    100 -
                    start.x
                );

        }

    }


    box =
        normalizeBox(
            next
        );


    applyBox();

}


/* =========================================================
   END INTERACTION
   ========================================================= */

function endInteraction(event) {

    if (
        !interaction
    ) {

        return;

    }


    event.preventDefault();


    /*
       Normalize one final time.
    */

    box =
        normalizeBox(
            box
        );


    applyBox();


    /*
       Send the final position.
    */

    sendComponentValue(
        box
    );


    /*
       VERY IMPORTANT:

       Keep userHasInteracted = true.

       This prevents the next Streamlit rerun
       from replacing the local box with stale
       initial values.
    */

    userHasInteracted =
        true;


    interaction =
        null;


    setFrameHeight();

}


/* =========================================================
   BLUR BOX MOVE
   ========================================================= */

blurBox.addEventListener(

    "pointerdown",

    function(event) {

        /*
           Resize handle was touched.
           Let the handle handle it.
        */

        if (
            event.target.classList.contains(
                "handle"
            )
        ) {

            return;

        }


        startInteraction(
            event,
            "move"
        );

    }

);


/* =========================================================
   RESIZE HANDLES
   ========================================================= */

document
    .querySelectorAll(
        ".handle"
    )
    .forEach(

        function(handle) {

            handle.addEventListener(

                "pointerdown",

                function(event) {

                    const type =
                        handle.dataset.handle;


                    startInteraction(

                        event,

                        type

                    );

                }

            );

        }

    );


/* =========================================================
   POINTER MOVE
   ========================================================= */

window.addEventListener(

    "pointermove",

    function(event) {

        if (
            !interaction
        ) {

            return;

        }


        updateInteraction(
            event
        );

    },

    {

        passive: false

    }

);


/* =========================================================
   POINTER UP
   ========================================================= */

window.addEventListener(

    "pointerup",

    function(event) {

        endInteraction(
            event
        );

    },

    {

        passive: false

    }

);


/* =========================================================
   POINTER CANCEL
   ========================================================= */

window.addEventListener(

    "pointercancel",

    function(event) {

        endInteraction(
            event
        );

    },

    {

        passive: false

    }

);


/* =========================================================
   STREAMLIT RENDER
   ========================================================= */

window.addEventListener(

    "message",

    function(event) {

        const message =
            event.data;


        if (
            !message
        ) {

            return;

        }


        if (
            message.type !==
            RENDER
        ) {

            return;

        }


        const args =
            message.args || {};


        currentArgs =
            args;


        /* =================================================
           VIDEO SOURCE
           ================================================= */

        if (
            args.video_src
        ) {

            const newSource =
                args.video_src;


            /*
               Detect a new uploaded video.
            */

            const sourceChanged =
                newSource !==
                currentVideoSource;


            if (
                sourceChanged
            ) {

                currentVideoSource =
                    newSource;


                initializedForSource =
                    false;


                userHasInteracted =
                    false;


                /*
                   Load the new video.
                */

                video.src =
                    newSource;


                video.load();

            }

        }


        /* =================================================
           INITIAL BOX
           ================================================= */

        if (
            !interaction
        ) {

            loadInitialBox(
                args
            );

        }


        /*
           Update iframe height.
        */

        requestAnimationFrame(

            setFrameHeight

        );

    }

);


/* =========================================================
   VIDEO METADATA
   ========================================================= */

video.addEventListener(

    "loadedmetadata",

    function() {

        updateVideoAspectRatio();


        requestAnimationFrame(

            setFrameHeight

        );

    }

);


/* =========================================================
   VIDEO LOADED
   ========================================================= */

video.addEventListener(

    "loadeddata",

    function() {

        updateVideoAspectRatio();


        requestAnimationFrame(

            setFrameHeight

        );

    }

);


/* =========================================================
   VIDEO RESIZE
   ========================================================= */

video.addEventListener(

    "resize",

    function() {

        updateVideoAspectRatio();

    }

);


/* =========================================================
   WINDOW RESIZE
   ========================================================= */

window.addEventListener(

    "resize",

    function() {

        requestAnimationFrame(

            setFrameHeight

        );

    }

);


/* =========================================================
   RESIZE OBSERVER
   ========================================================= */

if (
    typeof ResizeObserver !==
    "undefined"
) {

    const observer =
        new ResizeObserver(

            function() {

                requestAnimationFrame(

                    setFrameHeight

                );

            }

        );


    observer.observe(
        editor
    );

}


/* =========================================================
   INITIAL
   ========================================================= */

applyBox();


setComponentReady();


setTimeout(

    setFrameHeight,

    100

);


setTimeout(

    setFrameHeight,

    500

);


setTimeout(

    setFrameHeight,

    1000

);

</script>

</body>

</html>
