<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Blur Video Editor</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: transparent;
    font-family: Arial, sans-serif;
}

#editor {

    position: relative;

    width: 100%;

    max-width: 900px;

    margin: 0 auto;

    background: #000;

    overflow: hidden;

    border-radius: 12px;

    line-height: 0;

}

#video {

    display: block;

    width: 100%;

    height: auto;

    max-height: 75vh;

    background: #000;

    object-fit: contain;

}


/* ======================================================
   BLUR BOX
====================================================== */

#blurBox {

    position: absolute;

    border: 3px solid #ff3030;

    background:
        rgba(255, 0, 0, 0.20);

    box-shadow:
        0 0 0 1px
        rgba(255,255,255,0.35);

    cursor: move;

    touch-action: none;

    user-select: none;

    z-index: 20;

}


/* ======================================================
   LABEL
====================================================== */

#blurBox .label {

    position: absolute;

    top: -27px;

    left: -3px;

    height: 24px;

    padding: 4px 9px;

    background: #ff3030;

    color: white;

    font-size: 12px;

    font-weight: bold;

    line-height: 16px;

    border-radius:
        5px 5px 0 0;

    pointer-events: none;

    white-space: nowrap;

}


/* ======================================================
   RESIZE HANDLES
====================================================== */

.handle {

    position: absolute;

    width: 20px;

    height: 20px;

    background: #ffffff;

    border:
        3px solid #ff3030;

    border-radius: 50%;

    transform:
        translate(-50%, -50%);

    touch-action: none;

    user-select: none;

    z-index: 30;

}


/* ======================================================
   HANDLE POSITIONS
====================================================== */

.handle.nw {

    left: 0%;

    top: 0%;

    cursor: nwse-resize;

}

.handle.n {

    left: 50%;

    top: 0%;

    cursor: ns-resize;

}

.handle.ne {

    left: 100%;

    top: 0%;

    cursor: nesw-resize;

}

.handle.e {

    left: 100%;

    top: 50%;

    cursor: ew-resize;

}

.handle.se {

    left: 100%;

    top: 100%;

    cursor: nwse-resize;

}

.handle.s {

    left: 50%;

    top: 100%;

    cursor: ns-resize;

}

.handle.sw {

    left: 0%;

    top: 100%;

    cursor: nesw-resize;

}

.handle.w {

    left: 0%;

    top: 50%;

    cursor: ew-resize;

}


/* ======================================================
   LOADING
====================================================== */

#loading {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(0,0,0,0.55);

    color: white;

    font-size: 15px;

    line-height: normal;

    z-index: 10;

    pointer-events: none;

}

#loading.hidden {

    display: none;

}


/* ======================================================
   HINT
====================================================== */

#hint {

    margin-top: 8px;

    padding: 8px 10px;

    color: #cccccc;

    font-size: 12px;

    line-height: 18px;

    text-align: center;

}

</style>

</head>


<body>


<div id="editor">


    <video
        id="video"
        controls
        playsinline
        preload="metadata"
    ></video>


    <div id="loading">
        Loading video...
    </div>


    <div id="blurBox">


        <div class="label">
            BLUR
        </div>


        <div
            class="handle nw"
            data-handle="nw"
        ></div>


        <div
            class="handle n"
            data-handle="n"
        ></div>


        <div
            class="handle ne"
            data-handle="ne"
        ></div>


        <div
            class="handle e"
            data-handle="e"
        ></div>


        <div
            class="handle se"
            data-handle="se"
        ></div>


        <div
            class="handle s"
            data-handle="s"
        ></div>


        <div
            class="handle sw"
            data-handle="sw"
        ></div>


        <div
            class="handle w"
            data-handle="w"
        ></div>


    </div>


</div>


<div id="hint">

    📱 Drag the red box to move •
    Drag corners/edges to resize

</div>


<!-- =====================================================
     STREAMLIT COMPONENT LIBRARY
===================================================== -->

<script
    src="https://unpkg.com/streamlit-component-lib/dist/index.js">
</script>


<script>


/* ======================================================
   ELEMENTS
====================================================== */

const editor =
    document.getElementById(
        "editor"
    );


const video =
    document.getElementById(
        "video"
    );


const blurBox =
    document.getElementById(
        "blurBox"
    );


const loading =
    document.getElementById(
        "loading"
    );


/* ======================================================
   STATE
====================================================== */

let state = {

    x: 10,

    y: 78,

    width: 80,

    height: 18

};


let currentSource = "";

let currentBlobUrl = null;

let action = null;


/* ======================================================
   CLAMP
====================================================== */

function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


/* ======================================================
   NORMALIZE BOX
====================================================== */

function normalizeBox(box) {

    let x =
        Number(
            box.x ?? 10
        );


    let y =
        Number(
            box.y ?? 78
        );


    let width =
        Number(
            box.width ?? 80
        );


    let height =
        Number(
            box.height ?? 18
        );


    const minWidth = 8;

    const minHeight = 5;


    width =
        clamp(
            width,
            minWidth,
            100
        );


    height =
        clamp(
            height,
            minHeight,
            100
        );


    x =
        clamp(
            x,
            0,
            100 - width
        );


    y =
        clamp(
            y,
            0,
            100 - height
        );


    return {

        x,

        y,

        width,

        height

    };

}


/* ======================================================
   RENDER BOX
====================================================== */

function renderBox() {

    blurBox.style.left =
        state.x + "%";


    blurBox.style.top =
        state.y + "%";


    blurBox.style.width =
        state.width + "%";


    blurBox.style.height =
        state.height + "%";

}


/* ======================================================
   SEND TO STREAMLIT
====================================================== */

function sendValue() {

    if (
        typeof Streamlit ===
        "undefined"
    ) {

        return;

    }


    Streamlit.setComponentValue({

        x:
            Number(
                state.x.toFixed(3)
            ),

        y:
            Number(
                state.y.toFixed(3)
            ),

        width:
            Number(
                state.width.toFixed(3)
            ),

        height:
            Number(
                state.height.toFixed(3)
            )

    });

}


/* ======================================================
   LOAD VIDEO
====================================================== */

function loadVideo(src) {

    if (!src) {

        return;

    }


    if (
        src === currentSource
    ) {

        return;

    }


    currentSource = src;


    loading.classList.remove(
        "hidden"
    );


    try {


        /* ------------------------------------------------
           CLEAN OLD BLOB
        ------------------------------------------------ */

        if (
            currentBlobUrl
        ) {

            try {

                URL.revokeObjectURL(
                    currentBlobUrl
                );

            } catch (error) {

                // ignore

            }

            currentBlobUrl = null;

        }


        /* ------------------------------------------------
           DATA URL -> BLOB
        ------------------------------------------------ */

        if (
            src.startsWith(
                "data:"
            )
        ) {

            const commaIndex =
                src.indexOf(",");


            if (
                commaIndex > -1
            ) {

                const header =
                    src.substring(
                        0,
                        commaIndex
                    );


                const data =
                    src.substring(
                        commaIndex + 1
                    );


                const mimeMatch =
                    header.match(
                        /data:(.*?);base64/
                    );


                const mime =
                    mimeMatch
                        ? mimeMatch[1]
                        : "video/mp4";


                const binary =
                    atob(data);


                const length =
                    binary.length;


                const bytes =
                    new Uint8Array(
                        length
                    );


                for (
                    let i = 0;
                    i < length;
                    i++
                ) {

                    bytes[i] =
                        binary.charCodeAt(i);

                }


                const blob =
                    new Blob(
                        [
                            bytes
                        ],
                        {
                            type: mime
                        }
                    );


                currentBlobUrl =
                    URL.createObjectURL(
                        blob
                    );


                video.src =
                    currentBlobUrl;


            } else {

                video.src =
                    src;

            }


        } else {

            video.src =
                src;

        }


        video.load();


    } catch (error) {


        console.error(
            "Video loading error:",
            error
        );


        video.src =
            src;


        video.load();

    }

}


/* ======================================================
   VIDEO METADATA
====================================================== */

video.addEventListener(
    "loadedmetadata",
    function() {

        loading.classList.add(
            "hidden"
        );

        updateFrameHeight();

    }
);


video.addEventListener(
    "canplay",
    function() {

        loading.classList.add(
            "hidden"
        );

        updateFrameHeight();

    }
);


video.addEventListener(
    "error",
    function() {

        loading.textContent =
            "Unable to preview this video format.";

        loading.classList.remove(
            "hidden"
        );

    }
);


/* ======================================================
   FRAME HEIGHT
====================================================== */

function updateFrameHeight() {

    if (
        typeof Streamlit ===
        "undefined"
    ) {

        return;

    }


    requestAnimationFrame(
        function() {

            const height =
                Math.ceil(
                    document.body
                        .getBoundingClientRect()
                        .height
                );


            Streamlit.setFrameHeight(
                height + 4
            );

        }
    );

}


/* ======================================================
   START ACTION
====================================================== */

function startAction(
    event,
    type
) {

    event.preventDefault();

    event.stopPropagation();


    const rect =
        editor.getBoundingClientRect();


    action = {

        type:

            type,


        startX:

            event.clientX,


        startY:

            event.clientY,


        editorWidth:

            rect.width,


        editorHeight:

            rect.height,


        initial: {

            ...state

        }

    };


    try {

        event.target.setPointerCapture(
            event.pointerId
        );

    } catch (error) {

        // Ignore

    }

}


/* ======================================================
   UPDATE ACTION
====================================================== */

function updateAction(
    event
) {

    if (!action) {

        return;

    }


    event.preventDefault();


    const dx =
        (
            event.clientX
            -
            action.startX
        )
        /
        action.editorWidth
        *
        100;


    const dy =
        (
            event.clientY
            -
            action.startY
        )
        /
        action.editorHeight
        *
        100;


    let x =
        action.initial.x;


    let y =
        action.initial.y;


    let width =
        action.initial.width;


    let height =
        action.initial.height;


    const minWidth = 8;

    const minHeight = 5;


    /* ==================================================
       MOVE
    ================================================== */

    if (
        action.type ===
        "move"
    ) {

        x += dx;

        y += dy;

    }


    /* ==================================================
       EAST
    ================================================== */

    if (
        action.type.includes(
            "e"
        )
    ) {

        width =
            action.initial.width
            +
            dx;

    }


    /* ==================================================
       SOUTH
    ================================================== */

    if (
        action.type.includes(
            "s"
        )
    ) {

        height =
            action.initial.height
            +
            dy;

    }


    /* ==================================================
       WEST
    ================================================== */

    if (
        action.type.includes(
            "w"
        )
    ) {

        const right =
            action.initial.x
            +
            action.initial.width;


        x =
            action.initial.x
            +
            dx;


        x =
            clamp(
                x,
                0,
                right - minWidth
            );


        width =
            right - x;

    }


    /* ==================================================
       NORTH
    ================================================== */

    if (
        action.type.includes(
            "n"
        )
    ) {

        const bottom =
            action.initial.y
            +
            action.initial.height;


        y =
            action.initial.y
            +
            dy;


        y =
            clamp(
                y,
                0,
                bottom - minHeight
            );


        height =
            bottom - y;

    }


    /* ==================================================
       FINAL CLAMP
    ================================================== */

    width =
        clamp(
            width,
            minWidth,
            100 - x
        );


    height =
        clamp(
            height,
            minHeight,
            100 - y
        );


    x =
        clamp(
            x,
            0,
            100 - width
        );


    y =
        clamp(
            y,
            0,
            100 - height
        );


    state = {

        x,

        y,

        width,

        height

    };


    renderBox();

}


/* ======================================================
   END ACTION
====================================================== */

function endAction(
    event
) {

    if (!action) {

        return;

    }


    event.preventDefault();


    action = null;


    renderBox();


    /*
       Send only after drag/resize ends.
       This avoids Streamlit rerunning on
       every pixel movement.
    */

    sendValue();

}


/* ======================================================
   MOVE BOX
====================================================== */

blurBox.addEventListener(
    "pointerdown",
    function(event) {


        if (
            event.target.closest(
                ".handle"
            )
        ) {

            return;

        }


        startAction(
            event,
            "move"
        );

    }
);


/* ======================================================
   RESIZE HANDLES
====================================================== */

document
    .querySelectorAll(
        ".handle"
    )
    .forEach(
        function(handle) {


            handle.addEventListener(
                "pointerdown",
                function(event) {


                    startAction(
                        event,
                        handle.dataset.handle
                    );

                }
            );


        }
    );


/* ======================================================
   GLOBAL POINTER EVENTS
====================================================== */

document.addEventListener(
    "pointermove",
    updateAction,
    {
        passive: false
    }
);


document.addEventListener(
    "pointerup",
    endAction,
    {
        passive: false
    }
);


document.addEventListener(
    "pointercancel",
    endAction,
    {
        passive: false
    }
);


/* ======================================================
   STREAMLIT RENDER
====================================================== */

function onRender(
    event
) {

    const args =
        event.detail.args || {};


    state =
        normalizeBox({

            x:
                args.initial_x ??
                10,


            y:
                args.initial_y ??
                78,


            width:
                args.initial_width ??
                80,


            height:
                args.initial_height ??
                18

        });


    renderBox();


    if (
        args.video_src
    ) {

        loadVideo(
            args.video_src
        );

    }


    updateFrameHeight();

}


/* ======================================================
   STREAMLIT READY
====================================================== */

if (
    typeof Streamlit !==
    "undefined"
) {


    Streamlit.setComponentReady();


    Streamlit.events.addEventListener(
        Streamlit.RENDER_EVENT,
        onRender
    );


    Streamlit.setFrameHeight(
        450
    );

}


/* ======================================================
   RESIZE
====================================================== */

window.addEventListener(
    "resize",
    updateFrameHeight
);


/* ======================================================
   INITIAL BOX
====================================================== */

renderBox();

</script>

</body>

</html>
