<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Blur Video Editor</title>

    <script src="https://unpkg.com/streamlit-component-lib/dist/index.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .editor {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            overflow: hidden;
            border-radius: 12px;
            box-shadow:
                0 4px 18px rgba(0, 0, 0, 0.35);
            touch-action: pan-y;
        }

        video {
            display: block;
            width: 100%;
            height: auto;
            max-height: 80vh;
            background: #000;
            object-fit: contain;
        }

        .blur-box {
            position: absolute;

            border: 3px solid #ff2b2b;

            background:
                rgba(255, 0, 0, 0.22);

            box-shadow:
                0 0 0 1px
                rgba(255,255,255,0.25);

            cursor: move;

            touch-action: none;

            user-select: none;

            -webkit-user-select: none;

            z-index: 20;
        }

        .blur-label {
            position: absolute;

            top: -28px;
            left: -3px;

            background: #ff2b2b;

            color: #ffffff;

            font-size: 12px;

            font-weight: bold;

            padding: 4px 8px;

            border-radius: 5px 5px 0 0;

            pointer-events: none;

            white-space: nowrap;
        }

        .handle {
            position: absolute;

            width: 18px;
            height: 18px;

            background: #ffffff;

            border: 3px solid #ff2b2b;

            border-radius: 50%;

            z-index: 30;

            touch-action: none;

            user-select: none;

            -webkit-user-select: none;
        }

        .handle.nw {
            left: -10px;
            top: -10px;
            cursor: nwse-resize;
        }

        .handle.n {
            left: 50%;
            top: -10px;
            transform: translateX(-50%);
            cursor: ns-resize;
        }

        .handle.ne {
            right: -10px;
            top: -10px;
            cursor: nesw-resize;
        }

        .handle.e {
            right: -10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: ew-resize;
        }

        .handle.se {
            right: -10px;
            bottom: -10px;
            cursor: nwse-resize;
        }

        .handle.s {
            left: 50%;
            bottom: -10px;
            transform: translateX(-50%);
            cursor: ns-resize;
        }

        .handle.sw {
            left: -10px;
            bottom: -10px;
            cursor: nesw-resize;
        }

        .handle.w {
            left: -10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: ew-resize;
        }

        .instructions {
            margin-top: 10px;

            padding: 10px 12px;

            background:
                rgba(128, 0, 255, 0.10);

            border: 1px solid
                rgba(128, 0, 255, 0.30);

            border-radius: 8px;

            color: #dddddd;

            font-size: 13px;

            line-height: 1.5;

            text-align: center;
        }

        @media (max-width: 600px) {

            .video-wrapper {
                border-radius: 8px;
            }

            .blur-box {
                border-width: 2px;
            }

            .handle {
                width: 20px;
                height: 20px;
            }

            .blur-label {
                font-size: 11px;
                padding: 3px 6px;
                top: -25px;
            }

            .instructions {
                font-size: 12px;
            }
        }

    </style>
</head>

<body>

<div class="editor">

    <div
        id="videoWrapper"
        class="video-wrapper"
    >

        <video
            id="video"
            controls
            playsinline
            preload="metadata"
        ></video>

        <div
            id="blurBox"
            class="blur-box"
        >

            <div class="blur-label">
                🔲 BLUR
            </div>

            <div
                class="handle nw"
                data-handle="nw"
            ></div>

            <div
                class="handle n"
                data-handle="n"
            ></div>

            <div
                class="handle ne"
                data-handle="ne"
            ></div>

            <div
                class="handle e"
                data-handle="e"
            ></div>

            <div
                class="handle se"
                data-handle="se"
            ></div>

            <div
                class="handle s"
                data-handle="s"
            ></div>

            <div
                class="handle sw"
                data-handle="sw"
            ></div>

            <div
                class="handle w"
                data-handle="w"
            ></div>

        </div>

    </div>

    <div class="instructions">
        📱 <b>Move:</b> Blur Box အလယ်ကို လက်နဲ့ဆွဲပါ
        &nbsp; • &nbsp;
        ↔️ <b>Resize:</b> Corner / Edge အဖြူစက်ကို ဆွဲပါ
    </div>

</div>


<script>

(function () {

    const video =
        document.getElementById("video");

    const wrapper =
        document.getElementById("videoWrapper");

    const box =
        document.getElementById("blurBox");

    const handles =
        document.querySelectorAll(".handle");


    // =====================================================
    // STATE
    // =====================================================

    let state = {
        x: 10,
        y: 78,
        width: 80,
        height: 18
    };

    let currentVideoSrc = "";

    let action = null;


    // =====================================================
    // LIMITS
    // =====================================================

    const MIN_WIDTH = 5;

    const MIN_HEIGHT = 4;


    // =====================================================
    // NUMBER HELPERS
    // =====================================================

    function numberOrDefault(
        value,
        fallback
    ) {

        const number =
            Number(value);

        if (
            Number.isFinite(number)
        ) {

            return number;

        }

        return fallback;
    }


    function clamp(
        value,
        min,
        max
    ) {

        return Math.max(
            min,
            Math.min(
                max,
                value
            )
        );

    }


    // =====================================================
    // NORMALIZE BOX
    // =====================================================

    function normalizeState() {

        state.width =
            clamp(
                numberOrDefault(
                    state.width,
                    80
                ),
                MIN_WIDTH,
                100
            );

        state.height =
            clamp(
                numberOrDefault(
                    state.height,
                    18
                ),
                MIN_HEIGHT,
                100
            );

        state.x =
            clamp(
                numberOrDefault(
                    state.x,
                    10
                ),
                0,
                100 - state.width
            );

        state.y =
            clamp(
                numberOrDefault(
                    state.y,
                    78
                ),
                0,
                100 - state.height
            );

    }


    // =====================================================
    // DRAW BOX
    // =====================================================

    function renderBox() {

        normalizeState();

        box.style.left =
            state.x + "%";

        box.style.top =
            state.y + "%";

        box.style.width =
            state.width + "%";

        box.style.height =
            state.height + "%";

    }


    // =====================================================
    // SEND VALUE TO STREAMLIT
    // =====================================================

    function sendValue() {

        if (
            typeof Streamlit !==
            "undefined"
        ) {

            Streamlit.setComponentValue({
                x: Number(
                    state.x.toFixed(3)
                ),

                y: Number(
                    state.y.toFixed(3)
                ),

                width: Number(
                    state.width.toFixed(3)
                ),

                height: Number(
                    state.height.toFixed(3)
                )
            });

        }

    }


    // =====================================================
    // COMPONENT HEIGHT
    // =====================================================

    function updateHeight() {

        if (
            typeof Streamlit !==
            "undefined"
        ) {

            const height =
                document.body
                    .getBoundingClientRect()
                    .height;

            Streamlit.setFrameHeight(
                Math.ceil(
                    height + 10
                )
            );

        }

    }


    // =====================================================
    // LOAD STREAMLIT ARGS
    // =====================================================

    function onRender(event) {

        const args =
            event.detail.args || {};


        // -------------------------------------------------
        // Video Source
        // -------------------------------------------------

        const videoSrc =
            args.video_src || "";


        if (
            videoSrc &&
            videoSrc !== currentVideoSrc
        ) {

            currentVideoSrc =
                videoSrc;

            video.src =
                videoSrc;

            video.load();

        }


        // -------------------------------------------------
        // Initial Blur Box
        // -------------------------------------------------

        state.x =
            numberOrDefault(
                args.initial_x,
                state.x
            );

        state.y =
            numberOrDefault(
                args.initial_y,
                state.y
            );

        state.width =
            numberOrDefault(
                args.initial_width,
                state.width
            );

        state.height =
            numberOrDefault(
                args.initial_height,
                state.height
            );


        normalizeState();

        renderBox();

        setTimeout(
            updateHeight,
            50
        );

    }


    // =====================================================
    // POINTER START
    // =====================================================

    function pointerStart(
        event,
        actionType
    ) {

        event.preventDefault();

        event.stopPropagation();


        const rect =
            wrapper.getBoundingClientRect();


        action = {

            type: actionType,

            pointerId:
                event.pointerId,

            startX:
                event.clientX,

            startY:
                event.clientY,

            initialX:
                state.x,

            initialY:
                state.y,

            initialWidth:
                state.width,

            initialHeight:
                state.height,

            rectWidth:
                rect.width,

            rectHeight:
                rect.height

        };


        try {

            wrapper.setPointerCapture(
                event.pointerId
            );

        } catch (error) {
        }

    }


    // =====================================================
    // POINTER MOVE
    // =====================================================

    function pointerMove(event) {

        if (!action) {
            return;
        }


        event.preventDefault();


        const dx =
            (
                event.clientX
                - action.startX
            )
            /
            action.rectWidth
            * 100;


        const dy =
            (
                event.clientY
                - action.startY
            )
            /
            action.rectHeight
            * 100;


        // =================================================
        // MOVE
        // =================================================

        if (
            action.type === "move"
        ) {

            state.x =
                clamp(
                    action.initialX + dx,
                    0,
                    100 - action.initialWidth
                );

            state.y =
                clamp(
                    action.initialY + dy,
                    0,
                    100 - action.initialHeight
                );

        }


        // =================================================
        // RESIZE NORTH-WEST
        // =================================================

        else if (
            action.type === "nw"
        ) {

            let newX =
                action.initialX + dx;

            let newY =
                action.initialY + dy;

            let newWidth =
                action.initialWidth - dx;

            let newHeight =
                action.initialHeight - dy;


            if (
                newWidth < MIN_WIDTH
            ) {

                newWidth =
                    MIN_WIDTH;

                newX =
                    action.initialX
                    +
                    action.initialWidth
                    -
                    MIN_WIDTH;

            }


            if (
                newHeight < MIN_HEIGHT
            ) {

                newHeight =
                    MIN_HEIGHT;

                newY =
                    action.initialY
                    +
                    action.initialHeight
                    -
                    MIN_HEIGHT;

            }


            newX =
                clamp(
                    newX,
                    0,
                    100 - newWidth
                );

            newY =
                clamp(
                    newY,
                    0,
                    100 - newHeight
                );


            state.x = newX;
            state.y = newY;
            state.width = newWidth;
            state.height = newHeight;

        }


        // =================================================
        // RESIZE NORTH
        // =================================================

        else if (
            action.type === "n"
        ) {

            let newY =
                action.initialY + dy;

            let newHeight =
                action.initialHeight - dy;


            if (
                newHeight < MIN_HEIGHT
            ) {

                newHeight =
                    MIN_HEIGHT;

                newY =
                    action.initialY
                    +
                    action.initialHeight
                    -
                    MIN_HEIGHT;

            }


            newY =
                clamp(
                    newY,
                    0,
                    100 - newHeight
                );


            state.y =
                newY;

            state.height =
                newHeight;

        }


        // =================================================
        // RESIZE NORTH-EAST
        // =================================================

        else if (
            action.type === "ne"
        ) {

            let newY =
                action.initialY + dy;

            let newWidth =
                action.initialWidth + dx;

            let newHeight =
                action.initialHeight - dy;


            if (
                newWidth < MIN_WIDTH
            ) {

                newWidth =
                    MIN_WIDTH;

            }


            if (
                newHeight < MIN_HEIGHT
            ) {

                newHeight =
                    MIN_HEIGHT;

                newY =
                    action.initialY
                    +
                    action.initialHeight
                    -
                    MIN_HEIGHT;

            }


            newWidth =
                Math.min(
                    newWidth,
                    100 - action.initialX
                );

            newY =
                clamp(
                    newY,
                    0,
                    100 - newHeight
                );


            state.x =
                action.initialX;

            state.y =
                newY;

            state.width =
                newWidth;

            state.height =
                newHeight;

        }


        // =================================================
        // RESIZE EAST
        // =================================================

        else if (
            action.type === "e"
        ) {

            let newWidth =
                action.initialWidth + dx;


            newWidth =
                clamp(
                    newWidth,
                    MIN_WIDTH,
                    100 - action.initialX
                );


            state.width =
                newWidth;

        }


        // =================================================
        // RESIZE SOUTH-EAST
        // =================================================

        else if (
            action.type === "se"
        ) {

            let newWidth =
                action.initialWidth + dx;

            let newHeight =
                action.initialHeight + dy;


            newWidth =
                clamp(
                    newWidth,
                    MIN_WIDTH,
                    100 - action.initialX
                );

            newHeight =
                clamp(
                    newHeight,
                    MIN_HEIGHT,
                    100 - action.initialY
                );


            state.x =
                action.initialX;

            state.y =
                action.initialY;

            state.width =
                newWidth;

            state.height =
                newHeight;

        }


        // =================================================
        // RESIZE SOUTH
        // =================================================

        else if (
            action.type === "s"
        ) {

            let newHeight =
                action.initialHeight + dy;


            newHeight =
                clamp(
                    newHeight,
                    MIN_HEIGHT,
                    100 - action.initialY
                );


            state.height =
                newHeight;

        }


        // =================================================
        // RESIZE SOUTH-WEST
        // =================================================

        else if (
            action.type === "sw"
        ) {

            let newX =
                action.initialX + dx;

            let newWidth =
                action.initialWidth - dx;

            let newHeight =
                action.initialHeight + dy;


            if (
                newWidth < MIN_WIDTH
            ) {

                newWidth =
                    MIN_WIDTH;

                newX =
                    action.initialX
                    +
                    action.initialWidth
                    -
                    MIN_WIDTH;

            }


            newX =
                clamp(
                    newX,
                    0,
                    100 - newWidth
                );


            newHeight =
                clamp(
                    newHeight,
                    MIN_HEIGHT,
                    100 - action.initialY
                );


            state.x =
                newX;

            state.y =
                action.initialY;

            state.width =
                newWidth;

            state.height =
                newHeight;

        }


        // =================================================
        // RESIZE WEST
        // =================================================

        else if (
            action.type === "w"
        ) {

            let newX =
                action.initialX + dx;

            let newWidth =
                action.initialWidth - dx;


            if (
                newWidth < MIN_WIDTH
            ) {

                newWidth =
                    MIN_WIDTH;

                newX =
                    action.initialX
                    +
                    action.initialWidth
                    -
                    MIN_WIDTH;

            }


            newX =
                clamp(
                    newX,
                    0,
                    100 - newWidth
                );


            state.x =
                newX;

            state.width =
                newWidth;

        }


        normalizeState();

        renderBox();

    }


    // =====================================================
    // POINTER END
    // =====================================================

    function pointerEnd(event) {

        if (!action) {
            return;
        }


        event.preventDefault();


        try {

            wrapper.releasePointerCapture(
                action.pointerId
            );

        } catch (error) {
        }


        action = null;


        normalizeState();

        renderBox();

        sendValue();

        updateHeight();

    }


    // =====================================================
    // BLUR BOX MOVE
    // =====================================================

    box.addEventListener(
        "pointerdown",
        function (event) {

            if (
                event.target.classList.contains(
                    "handle"
                )
            ) {

                return;

            }

            pointerStart(
                event,
                "move"
            );

        }
    );


    // =====================================================
    // RESIZE HANDLES
    // =====================================================

    handles.forEach(
        function (handle) {

            handle.addEventListener(
                "pointerdown",
                function (event) {

                    const type =
                        handle.dataset.handle;

                    pointerStart(
                        event,
                        type
                    );

                }
            );

        }
    );


    // =====================================================
    // POINTER EVENTS
    // =====================================================

    wrapper.addEventListener(
        "pointermove",
        pointerMove
    );


    wrapper.addEventListener(
        "pointerup",
        pointerEnd
    );


    wrapper.addEventListener(
        "pointercancel",
        pointerEnd
    );


    wrapper.addEventListener(
        "lostpointercapture",
        function () {

            if (action) {

                action = null;

                sendValue();

            }

        }
    );


    // =====================================================
    // VIDEO METADATA
    // =====================================================

    video.addEventListener(
        "loadedmetadata",
        function () {

            setTimeout(
                updateHeight,
                100
            );

        }
    );


    // =====================================================
    // WINDOW RESIZE
    // =====================================================

    window.addEventListener(
        "resize",
        function () {

            renderBox();

            setTimeout(
                updateHeight,
                50
            );

        }
    );


    // =====================================================
    // STREAMLIT COMPONENT INITIALIZATION
    // =====================================================

    if (
        typeof Streamlit !==
        "undefined"
    ) {

        Streamlit.events.addEventListener(
            Streamlit.RENDER_EVENT,
            onRender
        );

        Streamlit.setComponentReady();

        Streamlit.setFrameHeight(
            500
        );

    }

})();

</script>

</body>
</html>
