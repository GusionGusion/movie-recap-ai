<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>
<title>Blur Video Editor</title><style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        background: #080b16;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #app {
        width: 100%;
        padding: 8px;
    }

    /* ==============================
       VIDEO AREA
       ============================== */

    #editor {
        position: relative;
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }

    #video {
        display: block;
        width: 100%;
        height: auto;
        max-height: 78vh;
        min-height: 320px;
        object-fit: contain;
        background: #000;
        pointer-events: none;
    }

    /* ==============================
       BLUR BOX
       ============================== */

    #blurBox {
        position: absolute;

        left: 10%;
        top: 78%;
        width: 80%;
        height: 18%;

        min-width: 40px;
        min-height: 30px;

        border: 2px solid #b56cff;
        background: rgba(160, 80, 255, 0.18);

        box-shadow:
            0 0 0 1px rgba(255,255,255,0.18),
            0 0 14px rgba(181,108,255,0.45);

        border-radius: 6px;

        touch-action: none;
        user-select: none;
        -webkit-user-select: none;

        z-index: 20;
    }

    #blurLabel {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);

        color: #fff;
        font-size: 13px;
        font-weight: bold;

        white-space: nowrap;
        pointer-events: none;

        text-shadow:
            0 1px 3px #000,
            0 0 6px #000;
    }

    /* ==============================
       RESIZE HANDLES
       ============================== */

    .handle {
        position: absolute;
        width: 20px;
        height: 20px;

        background: #fff;
        border: 2px solid #9b4dff;
        border-radius: 50%;

        box-shadow: 0 1px 6px rgba(0,0,0,0.7);

        z-index: 30;

        touch-action: none;
    }

    .nw {
        left: -10px;
        top: -10px;
        cursor: nwse-resize;
    }

    .n {
        left: 50%;
        top: -10px;
        transform: translateX(-50%);
        cursor: ns-resize;
    }

    .ne {
        right: -10px;
        top: -10px;
        cursor: nesw-resize;
    }

    .e {
        right: -10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: ew-resize;
    }

    .se {
        right: -10px;
        bottom: -10px;
        cursor: nwse-resize;
    }

    .s {
        left: 50%;
        bottom: -10px;
        transform: translateX(-50%);
        cursor: ns-resize;
    }

    .sw {
        left: -10px;
        bottom: -10px;
        cursor: nesw-resize;
    }

    .w {
        left: -10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: ew-resize;
    }

    /* ==============================
       MOBILE
       ============================== */

    @media (max-width: 700px) {

        #app {
            padding: 4px;
        }

        #editor {
            width: 100%;
            border-radius: 8px;
        }

        #video {
            width: 100%;
            max-height: 72vh;
            min-height: 260px;
        }

        .handle {
            width: 24px;
            height: 24px;
        }

        .nw {
            left: -12px;
            top: -12px;
        }

        .n {
            top: -12px;
        }

        .ne {
            right: -12px;
            top: -12px;
        }

        .e {
            right: -12px;
        }

        .se {
            right: -12px;
            bottom: -12px;
        }

        .s {
            bottom: -12px;
        }

        .sw {
            left: -12px;
            bottom: -12px;
        }

        .w {
            left: -12px;
        }

        #blurLabel {
            font-size: 12px;
        }
    }
</style></head><body><div id="app"><div id="editor">

    <video
        id="video"
        controls
        playsinline
        webkit-playsinline
        preload="metadata"
    ></video>

    <div id="blurBox">

        <div id="blurLabel">
            BLUR
        </div>

        <div class="handle nw" data-handle="nw"></div>
        <div class="handle n"  data-handle="n"></div>
        <div class="handle ne" data-handle="ne"></div>
        <div class="handle e"  data-handle="e"></div>
        <div class="handle se" data-handle="se"></div>
        <div class="handle s"  data-handle="s"></div>
        <div class="handle sw" data-handle="sw"></div>
        <div class="handle w"  data-handle="w"></div>

    </div>

</div>

</div><script>

/* =========================================================
   STREAMLIT COMPONENT
   ========================================================= */

const COMPONENT_READY = "streamlit:componentReady";
const SET_COMPONENT_VALUE = "streamlit:setComponentValue";
const SET_FRAME_HEIGHT = "streamlit:setFrameHeight";
const RENDER = "streamlit:render";

let currentArgs = {};

let box = {
    x: 10,
    y: 78,
    width: 80,
    height: 18
};

let interaction = null;

let lastSentValue = null;

const editor = document.getElementById("editor");
const video = document.getElementById("video");
const blurBox = document.getElementById("blurBox");


/* =========================================================
   STREAMLIT MESSAGE
   ========================================================= */

function sendComponentValue(value) {

    const rounded = {
        x: Number(value.x.toFixed(2)),
        y: Number(value.y.toFixed(2)),
        width: Number(value.width.toFixed(2)),
        height: Number(value.height.toFixed(2))
    };

    /*
       Prevent duplicate values from being sent.
    */
    const serialized = JSON.stringify(rounded);

    if (serialized === lastSentValue) {
        return;
    }

    lastSentValue = serialized;

    window.parent.postMessage(
        {
            isStreamlitMessage: true,
            type: SET_COMPONENT_VALUE,
            value: rounded,
            dataType: "json"
        },
        "*"
    );
}


function setFrameHeight() {

    const height = Math.max(
        320,
        editor.getBoundingClientRect().height + 16
    );

    window.parent.postMessage(
        {
            isStreamlitMessage: true,
            type: SET_FRAME_HEIGHT,
            height: Math.ceil(height)
        },
        "*"
    );
}


/* =========================================================
   COMPONENT READY
   ========================================================= */

function setComponentReady() {

    window.parent.postMessage(
        {
            isStreamlitMessage: true,
            type: COMPONENT_READY,
            apiVersion: 1
        },
        "*"
    );
}


/* =========================================================
   APPLY BOX
   ========================================================= */

function applyBox() {

    blurBox.style.left = box.x + "%";
    blurBox.style.top = box.y + "%";
    blurBox.style.width = box.width + "%";
    blurBox.style.height = box.height + "%";

    requestAnimationFrame(setFrameHeight);
}


/* =========================================================
   READ INITIAL VALUES
   ========================================================= */

function getNumber(value, fallback) {

    const n = Number(value);

    if (!Number.isFinite(n)) {
        return fallback;
    }

    return n;
}


function loadInitialBox(args) {

    /*
       IMPORTANT:

       Only load Python values when the component
       receives a NEW render.

       Do NOT reset the box while the user is
       dragging/resizing.
    */

    if (interaction !== null) {
        return;
    }

    const newBox = {

        x: getNumber(
            args.initial_x,
            10
        ),

        y: getNumber(
            args.initial_y,
            78
        ),

        width: getNumber(
            args.initial_width,
            80
        ),

        height: getNumber(
            args.initial_height,
            18
        )
    };

    box = normalizeBox(newBox);

    applyBox();
}


/* =========================================================
   NORMALIZE
   ========================================================= */

function normalizeBox(value) {

    let x = value.x;
    let y = value.y;
    let width = value.width;
    let height = value.height;

    width = Math.max(3, Math.min(width, 100));
    height = Math.max(3, Math.min(height, 100));

    x = Math.max(0, Math.min(x, 100 - width));
    y = Math.max(0, Math.min(y, 100 - height));

    return {
        x,
        y,
        width,
        height
    };
}


/* =========================================================
   POINTER POSITION
   ========================================================= */

function pointerPercent(event) {

    const rect = editor.getBoundingClientRect();

    const x =
        ((event.clientX - rect.left) / rect.width) * 100;

    const y =
        ((event.clientY - rect.top) / rect.height) * 100;

    return {
        x,
        y
    };
}


/* =========================================================
   START MOVE / RESIZE
   ========================================================= */

function startInteraction(event, type) {

    event.preventDefault();
    event.stopPropagation();

    const p = pointerPercent(event);

    interaction = {

        type: type,

        startPointerX: p.x,
        startPointerY: p.y,

        startBox: {
            x: box.x,
            y: box.y,
            width: box.width,
            height: box.height
        }
    };

    try {
        event.currentTarget.setPointerCapture(
            event.pointerId
        );
    } catch (e) {}

}


/* =========================================================
   MOVE / RESIZE
   ========================================================= */

function updateInteraction(event) {

    if (!interaction) {
        return;
    }

    event.preventDefault();

    const p = pointerPercent(event);

    const dx =
        p.x - interaction.startPointerX;

    const dy =
        p.y - interaction.startPointerY;

    const start = interaction.startBox;

    let next = {
        x: start.x,
        y: start.y,
        width: start.width,
        height: start.height
    };


    /* =========================
       MOVE
       ========================= */

    if (interaction.type === "move") {

        next.x = start.x + dx;
        next.y = start.y + dy;

        next.x = Math.max(
            0,
            Math.min(
                next.x,
                100 - next.width
            )
        );

        next.y = Math.max(
            0,
            Math.min(
                next.y,
                100 - next.height
            )
        );
    }


    /* =========================
       NORTH
       ========================= */

    if (interaction.type.includes("n")) {

        const newY =
            start.y + dy;

        const newHeight =
            start.height - dy;

        if (newHeight >= 3) {

            next.y = Math.max(
                0,
                newY
            );

            next.height =
                Math.min(
                    newHeight,
                    start.y + start.height
                );
        }
    }


    /* =========================
       SOUTH
       ========================= */

    if (interaction.type.includes("s")) {

        const newHeight =
            start.height + dy;

        if (newHeight >= 3) {

            next.height =
                Math.min(
                    newHeight,
                    100 - start.y
                );
        }
    }


    /* =========================
       WEST
       ========================= */

    if (interaction.type.includes("w")) {

        const newX =
            start.x + dx;

        const newWidth =
            start.width - dx;

        if (newWidth >= 3) {

            next.x = Math.max(
                0,
                newX
            );

            next.width =
                Math.min(
                    newWidth,
                    start.x + start.width
                );
        }
    }


    /* =========================
       EAST
       ========================= */

    if (interaction.type.includes("e")) {

        const newWidth =
            start.width + dx;

        if (newWidth >= 3) {

            next.width =
                Math.min(
                    newWidth,
                    100 - start.x
                );
        }
    }


    box = normalizeBox(next);

    applyBox();
}


/* =========================================================
   END INTERACTION
   ========================================================= */

function endInteraction(event) {

    if (!interaction) {
        return;
    }

    event.preventDefault();

    interaction = null;

    /*
       Send the FINAL position only once.
    */

    sendComponentValue(box);

    setFrameHeight();
}


/* =========================================================
   BLUR BOX EVENTS
   ========================================================= */

blurBox.addEventListener(
    "pointerdown",
    function(event) {

        /*
           If the user touched a resize handle,
           don't start moving the entire box.
        */

        if (
            event.target.classList.contains("handle")
        ) {
            return;
        }

        startInteraction(
            event,
            "move"
        );
    }
);


/* =========================================================
   RESIZE HANDLE EVENTS
   ========================================================= */

document
    .querySelectorAll(".handle")
    .forEach(function(handle) {

        handle.addEventListener(
            "pointerdown",
            function(event) {

                const type =
                    handle.dataset.handle;

                startInteraction(
                    event,
                    type
                );
            }
        );

    });


/* =========================================================
   GLOBAL POINTER EVENTS
   ========================================================= */

window.addEventListener(
    "pointermove",
    function(event) {

        if (!interaction) {
            return;
        }

        updateInteraction(event);

    },
    {
        passive: false
    }
);


window.addEventListener(
    "pointerup",
    function(event) {

        endInteraction(event);

    },
    {
        passive: false
    }
);


window.addEventListener(
    "pointercancel",
    function(event) {

        endInteraction(event);

    },
    {
        passive: false
    }
);


/* =========================================================
   STREAMLIT RENDER
   ========================================================= */

window.addEventListener(
    "message",
    function(event) {

        const message = event.data;

        if (!message) {
            return;
        }

        if (
            message.type !== RENDER
        ) {
            return;
        }

        const args =
            message.args || {};

        currentArgs = args;


        /* =========================
           VIDEO SOURCE
           ========================= */

        if (
            args.video_src &&
            video.src !== args.video_src
        ) {

            video.src =
                args.video_src;

            video.load();
        }


        /*
           IMPORTANT:

           Don't reset box from Python
           during active interaction.
        */

        if (!interaction) {

            loadInitialBox(
                args
            );

        }

    }
);


/* =========================================================
   VIDEO EVENTS
   ========================================================= */

video.addEventListener(
    "loadedmetadata",
    function() {

        requestAnimationFrame(
            setFrameHeight
        );

    }
);


video.addEventListener(
    "loadeddata",
    function() {

        requestAnimationFrame(
            setFrameHeight
        );

    }
);


/* =========================================================
   RESIZE OBSERVER
   ========================================================= */

if (
    typeof ResizeObserver !== "undefined"
) {

    const observer =
        new ResizeObserver(
            function() {

                requestAnimationFrame(
                    setFrameHeight
                );

            }
        );

    observer.observe(editor);
}


/* =========================================================
   INITIAL
   ========================================================= */

applyBox();

setComponentReady();

setTimeout(
    setFrameHeight,
    100
);

setTimeout(
    setFrameHeight,
    500
);

</script></body>
</html>
